version: "3"

# Pin the project name so volume/network names stay stable regardless of the
# directory this lives in (podman-compose otherwise derives them from the dir
# basename, which would orphan the imported vuln DB if the folder is renamed).
name: rhacs-scanner-local

services:
  scanner-v4-db:
    image: quay.io/stackrox-io/scanner-v4-db:4.10.2
    container_name: scanner-v4-db
    environment:
      POSTGRES_PASSWORD: scanner123
      POSTGRES_HOST_AUTH_METHOD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - scanner-v4-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/stackrox.d/config/postgresql.conf:ro
    shm_size: "750m"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - scanner-net

  vuln-server:
    image: docker.io/library/nginx:alpine
    container_name: vuln-server
    hostname: central
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server-cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/server-key.pem:/etc/nginx/certs/key.pem:ro
      - ./vuln-data:/data:ro
    networks:
      scanner-net:
        aliases:
          - central

  scanner-v4:
    image: quay.io/stackrox-io/scanner-v4:4.10.2
    container_name: scanner-v4
    depends_on:
      scanner-v4-db:
        condition: service_healthy
      vuln-server:
        condition: service_started
    environment:
      ROX_SCANNER_V4_ALLOW_ANONYMOUS_AUTH: "true"
      SCANNER_V4_STACKROX_SERVICES: "true"
      ROX_CENTRAL_ENDPOINT: "central:443"
    volumes:
      - ./scanner-config.yaml:/etc/scanner/config.yaml:ro
      - ./certs/ca.pem:/run/secrets/stackrox.io/certs/ca.pem:ro
      - ./certs/cert.pem:/run/secrets/stackrox.io/certs/cert.pem:ro
      - ./certs/key.pem:/run/secrets/stackrox.io/certs/key.pem:ro
    ports:
      - "8443:8443"
      - "9443:9443"
    command: ["-conf", "/etc/scanner/config.yaml"]
    networks:
      - scanner-net

volumes:
  scanner-v4-data:

networks:
  scanner-net:
    driver: bridge
