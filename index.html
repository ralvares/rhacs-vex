<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCP Vulnerability Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;700&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Red Hat Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    h1, h2, h3, .section-header h2, .sidebar-brand h1 { font-family: 'Red Hat Display', -apple-system, sans-serif; }
    code, .search-input, .detail-image, .detail-sha { font-family: 'Red Hat Mono', 'Consolas', 'Monaco', monospace; }
  </style>
</head>
<body class="pf-v5-theme-dark">
<div class="app">

  <!-- ── Sidebar ── -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div>
        <h1>OCP Vuln Intel</h1>
        <p>VEX triage &amp; false positive detection</p>
      </div>
    </div>
    <div class="status-bar">
      <span class="dot" id="dot"></span>
      <span id="status-text">Loading…</span>
    </div>
    <div class="sidebar-nav" id="sidebar-nav">
      <div class="nav-section">Views</div>
      <button class="nav-item active" data-view="overview">
        <span>Overview</span>
      </button>
      <button class="nav-item" data-view="compare">
        <span>Compare</span>
      </button>
      <button class="nav-item" data-view="trends">
        <span>Trends</span>
      </button>
      <button class="nav-item" data-view="cve">
        <span>CVE Search</span>
      </button>
      <div id="version-tree"></div>
    </div>
  </nav>

  <!-- ── Content ── -->
  <div class="content" id="content">
    <div class="empty"><div class="spinner"></div><p style="margin-top:1rem;color:var(--muted)">Loading…</p></div>
  </div>

</div>

<script type="module">
import { initDuckDB, loadManifest, registerScopes, queryFromScopes, query, registerScope, registerCveIndex, registerFileByURL } from './assets/db.js';
import { esc, statusBadge, statusKey, severityBadge, severityCompare, renderExpandRow, wireExpandButtons, createDropdown, downloadCSV } from './assets/ui.js';

// ── State ──
let manifest = null;
let dbReady  = false;
let currentView = 'overview';
let trendChart = null;

const $ = id => document.getElementById(id);
const setStatus = (msg, state) => {
  $('status-text').textContent = msg;
  $('dot').className = 'dot' + (state ? ' ' + state : '');
};

// ── Init ──
async function init() {
  try {
    manifest = await loadManifest();
    buildVersionTree();
    await initDuckDB(setStatus);
    dbReady = true;
    setStatus('Ready', 'ready');
    navigate(window.location.hash.slice(1) || 'overview');
  } catch (e) {
    console.error(e);
    setStatus('Error: ' + e.message, 'error');
    $('content').innerHTML = `<div class="empty"><h3>Failed to initialize</h3><p>${esc(e.message)}</p>
      <p style="margin-top:1rem">Serve with: <code>python3 -m http.server 8000</code></p></div>`;
  }
}

// ── Sidebar version tree ──
function buildVersionTree() {
  const scopes = manifest.scopes || {};
  const majors = {};
  for (const [key, val] of Object.entries(scopes)) {
    if (!key.startsWith('ocp/')) continue;
    const ver = key.replace('ocp/', '');
    const major = ver.split('.').slice(0, 2).join('.');
    if (!majors[major]) majors[major] = [];
    majors[major].push({ ver, ...val });
  }

  let html = '<div class="nav-section">OCP Releases</div>';
  for (const [major, versions] of Object.entries(majors).sort((a, b) => b[0].localeCompare(a[0]))) {
    versions.sort((a, b) => {
      const pa = a.ver.split('.').map(Number), pb = b.ver.split('.').map(Number);
      for (let i = 0; i < 3; i++) { if ((pa[i]||0) !== (pb[i]||0)) return (pb[i]||0) - (pa[i]||0); }
      return 0;
    });
    html += `<div class="nav-group">
      <div class="nav-group-header" onclick="this.classList.toggle('open')">
        <span class="caret">▸</span><span>OCP ${major}</span>
        <span class="badge-count">${versions.length}</span>
      </div>
      <div class="nav-group-items">
        ${versions.map(v => `
          <button class="nav-item" data-view="version" data-scope="ocp/${v.ver}">
            <span>${v.ver}</span>
            <span class="badge-count">${v.positive}</span>
          </button>
        `).join('')}
      </div>
    </div>`;
  }
  // Operator tree — group by operator name, deduplicate identical bundles across OCP versions
  const opsByName = {};
  for (const [key, val] of Object.entries(scopes)) {
    if (!key.startsWith('operators/')) continue;
    const opName = val.operator || val.label || key;
    const ch = val.channel || '';
    const bun = val.bundle || '';
    const dedupKey = `${opName}|${ch}|${bun}`;
    const shortLabel = [ch, bun].filter(Boolean).join(' ') || val.label || key.split('/').pop();
    if (!opsByName[opName]) opsByName[opName] = {};
    // Keep first occurrence per unique channel+bundle (dedup across OCP versions)
    if (!opsByName[opName][dedupKey]) {
      opsByName[opName][dedupKey] = { shortLabel, key, ocpVersions: [val.ocp_version], ...val };
    } else {
      opsByName[opName][dedupKey].ocpVersions.push(val.ocp_version);
    }
  }

  if (Object.keys(opsByName).length) {
    html += `<div class="nav-section">Operators</div>
      <div style="padding:0 .5rem .4rem">
        <input type="text" id="sidebar-search" placeholder="Search operators…"
          style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;
          color:var(--text);font-size:.72rem;padding:.25rem .5rem">
      </div>`;
    for (const [opName, bundles] of Object.entries(opsByName).sort((a, b) => a[0].localeCompare(b[0]))) {
      const versions = Object.values(bundles).sort((a, b) => a.shortLabel.localeCompare(b.shortLabel));
      html += `<div class="nav-group op-group" data-opname="${esc(opName.toLowerCase())}">
        <div class="nav-group-header" onclick="this.classList.toggle('open')">
          <span class="caret">▸</span><span>${esc(opName)}</span>
          <span class="badge-count">${versions.length}</span>
        </div>
        <div class="nav-group-items">
          ${versions.map(v => `
            <button class="nav-item" data-view="operator" data-scope="${v.key}">
              <span>${esc(v.shortLabel)}</span>
              <span class="badge-count">${v.positive}</span>
            </button>
          `).join('')}
        </div>
      </div>`;
    }
  }

  $('version-tree').innerHTML = html;

  // Wire sidebar search — matches all words against operator name + channel + version
  const searchEl = $('sidebar-search');
  if (searchEl) {
    searchEl.addEventListener('input', () => {
      const words = searchEl.value.toLowerCase().split(/\s+/).filter(Boolean);
      document.querySelectorAll('.op-group').forEach(g => {
        if (!words.length) { g.style.display = ''; return; }
        const items = g.querySelectorAll('.nav-item');
        let groupVisible = false;
        items.forEach(item => {
          const text = (g.dataset.opname + ' ' + (item.textContent || '')).toLowerCase();
          const match = words.every(w => text.includes(w));
          item.style.display = match ? '' : 'none';
          if (match) groupVisible = true;
        });
        g.style.display = groupVisible ? '' : 'none';
        if (groupVisible && words.length) {
          g.querySelector('.nav-group-header')?.classList.add('open');
        }
      });
    });
  }
}

// ── Navigation ──
function navigate(hash) {
  if (!hash) hash = 'overview';
  const parts = hash.split('/');
  const view = parts[0];
  window.location.hash = hash;

  document.querySelectorAll('.nav-item').forEach(el => {
    const v = el.dataset.view;
    const s = el.dataset.scope;
    el.classList.toggle('active',
      (v === view && !s) ||
      (v === 'version' && s && hash === s) ||
      (v === 'operator' && s && hash === s)
    );
  });

  currentView = view;
  if (view === 'overview')       renderOverview();
  else if (view === 'compare')   renderCompare();
  else if (view === 'trends')    renderTrends();
  else if (view === 'cve')       renderCVESearch(parts.slice(1).join('/'));
  else if (view === 'ocp')       renderVersion(hash);
  else if (view === 'operators') renderVersion(hash);
  else renderOverview();
}

$('sidebar-nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  const view  = item.dataset.view;
  const scope = item.dataset.scope;
  if (scope)      navigate(scope);
  else if (view)  navigate(view);
});

window.addEventListener('hashchange', () => navigate(window.location.hash.slice(1)));

// ══════════════════════════════════════════════════════════════
// ── OVERVIEW VIEW ──
// ══════════════════════════════════════════════════════════════
function renderOverview() {
  const scopes = manifest.scopes || {};
  const ocpScopes = Object.entries(scopes).filter(([k]) => k.startsWith('ocp/'));
  const opScopes  = Object.entries(scopes).filter(([k]) => k.startsWith('operators/'));

  // Deduplicate operators (same bundle across OCP versions)
  const opDedup = {};
  for (const [key, v] of opScopes) {
    const dedupKey = `${v.operator || ''}|${v.channel || ''}|${v.bundle || ''}`;
    if (!opDedup[dedupKey]) opDedup[dedupKey] = { key, ...v };
  }
  const uniqueOps = Object.values(opDedup);
  const opNames = new Set(uniqueOps.map(v => v.operator || ''));

  let ocpFindings = 0, ocpPos = 0, ocpFP = 0;
  for (const [, v] of ocpScopes) { ocpFindings += v.rows || 0; ocpPos += v.positive || 0; ocpFP += v.false_positive || 0; }
  let opFindings = 0, opPos = 0, opFP = 0;
  for (const v of uniqueOps) { opFindings += v.rows || 0; opPos += v.positive || 0; opFP += v.false_positive || 0; }

  $('content').innerHTML = `
    <div class="section-header">
      <h2>OCP Platform</h2>
      <span class="sub">${ocpScopes.length} releases — ${ocpPos.toLocaleString()} positive, ${ocpFP.toLocaleString()} false positive</span>
    </div>
    <div class="version-grid">
      ${ocpScopes.sort((a,b) => b[0].localeCompare(a[0])).map(([key, v]) => {
        const ver = key.replace('ocp/', '');
        const sev = v.severity || {};
        return `
          <div class="version-card" data-scope="${key}">
            <h3>OCP ${esc(ver)}</h3>
            <div class="stats">
              <div class="stat"><span class="stat-val" style="color:var(--red)">${v.positive}</span><span class="stat-label">Positive</span></div>
              <div class="stat"><span class="stat-val" style="color:var(--green)">${v.false_positive}</span><span class="stat-label">False Pos</span></div>
              <div class="stat"><span class="stat-val">${v.components || 0}</span><span class="stat-label">Images</span></div>
            </div>
            <div style="margin-top:.5rem;display:flex;gap:.3rem;flex-wrap:wrap">
              ${sev.Critical ? `<span class="badge bg-red">${sev.Critical} Crit</span>` : ''}
              ${sev.Important ? `<span class="badge bg-orange">${sev.Important} Imp</span>` : ''}
              ${sev.Moderate ? `<span class="badge bg-yellow">${sev.Moderate} Mod</span>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>
    ${uniqueOps.length ? `
    <div class="section-header" style="margin-top:1.5rem">
      <h2>Operators</h2>
      <span class="sub">${opNames.size} operators, ${uniqueOps.length} bundles — ${opPos.toLocaleString()} positive, ${opFP.toLocaleString()} false positive</span>
    </div>
    <div class="version-grid">
      ${uniqueOps.sort((a,b) => (a.operator||'').localeCompare(b.operator||'') || (a.channel||'').localeCompare(b.channel||'')).map(v => {
        const sev = v.severity || {};
        const label = [v.operator, v.channel, v.bundle].filter(Boolean).join(' ');
        return `
          <div class="version-card" data-scope="${v.key}">
            <h3>${esc(v.operator || v.label || '')}</h3>
            <div style="font-size:.7rem;color:var(--muted);margin-bottom:.4rem">${esc([v.channel, v.bundle].filter(Boolean).join(' '))}</div>
            <div class="stats">
              <div class="stat"><span class="stat-val" style="color:var(--red)">${v.positive}</span><span class="stat-label">Positive</span></div>
              <div class="stat"><span class="stat-val" style="color:var(--green)">${v.false_positive}</span><span class="stat-label">False Pos</span></div>
            </div>
            <div style="margin-top:.4rem;display:flex;gap:.3rem;flex-wrap:wrap">
              ${sev.Critical ? `<span class="badge bg-red">${sev.Critical} Crit</span>` : ''}
              ${sev.Important ? `<span class="badge bg-orange">${sev.Important} Imp</span>` : ''}
            </div>
          </div>`;
      }).join('')}
    </div>` : ''}`;

  $('content').querySelectorAll('.version-card').forEach(card => {
    card.addEventListener('click', () => navigate(card.dataset.scope));
  });
}

// ══════════════════════════════════════════════════════════════
// ── VERSION EXPLORER VIEW ──
// ══════════════════════════════════════════════════════════════
async function renderVersion(scope) {
  if (!dbReady) return;
  const scopeEntry = manifest.scopes?.[scope] || {};
  const label = scopeEntry.label || scope.replace('ocp/', 'OCP ').replace('operators/', '');
  $('content').innerHTML = `<div class="section-header"><h2>${esc(label)}</h2></div>
    <div class="empty"><div class="spinner"></div><p style="margin-top:1rem;color:var(--muted)">Loading…</p></div>`;

  try {
    const keys = await registerScopes(manifest, scope);
    const rows = await queryFromScopes(keys, `SELECT * FROM __FILES__ ORDER BY
      CASE WHEN AUDIT_RESULT LIKE '%FALSE%' THEN 0
           WHEN AUDIT_RESULT LIKE '%NOT ASSESSED%' THEN 1
           ELSE 2 END DESC,
      CASE SEVERITY WHEN 'Critical' THEN 0 WHEN 'Important' THEN 1 WHEN 'Moderate' THEN 2 ELSE 3 END,
      COMPONENT`);

    const posRows  = rows.filter(r => statusKey(r.AUDIT_RESULT) === 'Positive');
    const posCount = posRows.length;
    const fpCount  = rows.filter(r => statusKey(r.AUDIT_RESULT) === 'False Positive').length;
    const naCount  = rows.filter(r => statusKey(r.AUDIT_RESULT) === 'Not Assessed').length;
    const uniqueCves = new Set(posRows.map(r => r.CVE)).size;

    // Severity counts (unique CVEs, positives only)
    const sevCounts = {};
    const seenCve = new Set();
    posRows.forEach(r => {
      if (!seenCve.has(r.CVE)) {
        seenCve.add(r.CVE);
        const s = r.SEVERITY || 'Unknown';
        sevCounts[s] = (sevCounts[s] || 0) + 1;
      }
    });

    $('content').innerHTML = `
      <div class="section-header">
        <h2>${esc(label)}</h2>
        <span class="sub">${rows.length} findings across ${new Set(rows.map(r=>r.OCP_COMPONENT || r.COMPONENT)).size} components</span>
      </div>
      <div class="cards">
        <div class="card"><div class="card-label">Positive CVEs</div><div class="card-value red">${uniqueCves}</div></div>
        <div class="card"><div class="card-label">False Positive</div><div class="card-value green">${fpCount}</div></div>
        ${sevCounts.Critical ? `<div class="card"><div class="card-label">Critical</div><div class="card-value red">${sevCounts.Critical}</div></div>` : ''}
        ${sevCounts.Important ? `<div class="card"><div class="card-label">Important</div><div class="card-value" style="color:var(--orange)">${sevCounts.Important}</div></div>` : ''}
        ${sevCounts.Moderate ? `<div class="card"><div class="card-label">Moderate</div><div class="card-value yellow">${sevCounts.Moderate}</div></div>` : ''}
        ${sevCounts.Low ? `<div class="card"><div class="card-label">Low</div><div class="card-value" style="color:var(--muted)">${sevCounts.Low}</div></div>` : ''}
        <div class="card"><div class="card-label">Total Findings</div><div class="card-value blue">${rows.length}</div></div>
      </div>
      <div class="filter-bar" id="filter-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:.35rem">
        <label>FILTER BY:</label>
        <div id="filters" style="display:flex;align-items:center;flex-wrap:wrap;gap:.35rem"></div>
        <span class="filter-count" id="filter-count">${rows.length} shown</span>
        <button class="filter-clear" id="filter-clear" style="display:none">Clear all</button>
      </div>
      <div style="margin-bottom:.5rem;text-align:right">
        <button class="btn-export" id="export-btn">Export CSV</button>
      </div>
      <div class="table-wrap" id="table-wrap"></div>`;

    const filterState = {};
    const allCves       = [...new Set(rows.map(r => (r.CVE || '').trim()).filter(Boolean))].sort();
    const allComponents = [...new Set(rows.map(r => r.OCP_COMPONENT || '').filter(Boolean))].sort();
    const allPackages   = [...new Set(rows.map(r => r.COMPONENT || '').filter(Boolean))].sort();
    const allVersions   = [...new Set(rows.map(r => r.VERSION || '').filter(Boolean))].sort();
    const allSeverities = [...new Set(rows.map(r => r.SEVERITY || '').filter(Boolean))].sort();
    const allStates     = [...new Set(rows.map(r => statusKey(r.AUDIT_RESULT)).filter(Boolean))].sort();
    const allImages     = [...new Set(rows.map(r => (r.IMAGE || '').replace(/@sha256:[0-9a-f]+$/, '')).filter(Boolean))].sort();
    const mismatchCount = rows.filter(r => String(r.SEVERITY_MISMATCH).toLowerCase() === 'true').length;

    const filtersEl = $('filters');
    const onFilter = (id, selected) => { filterState[id] = selected; renderTable(); };
    filtersEl.appendChild(createDropdown('cve', 'CVE', allCves, onFilter));
    filtersEl.appendChild(createDropdown('component', 'Component', allComponents, onFilter));
    filtersEl.appendChild(createDropdown('package', 'Package', allPackages, onFilter));
    filtersEl.appendChild(createDropdown('pkgver', 'Pkg Version', allVersions, onFilter));
    filtersEl.appendChild(createDropdown('severity', 'Severity', allSeverities, onFilter));
    filtersEl.appendChild(createDropdown('state', 'State', allStates, onFilter));
    filtersEl.appendChild(createDropdown('image', 'Image', allImages, onFilter));
    filtersEl.appendChild(createDropdown('fixable', 'Fix', ['Fix', 'No fix'], onFilter));

    let mismatchOnly = false;
    const mismatchBtn = document.createElement('button');
    mismatchBtn.className = 'btn-export';
    mismatchBtn.innerHTML = `Mismatches <strong>${mismatchCount}</strong>`;
    mismatchBtn.addEventListener('click', () => {
      mismatchOnly = !mismatchOnly;
      mismatchBtn.style.borderColor = mismatchOnly ? 'var(--yellow)' : '';
      mismatchBtn.style.color = mismatchOnly ? 'var(--yellow)' : '';
      renderTable();
    });
    filtersEl.appendChild(mismatchBtn);

    $('filter-clear').addEventListener('click', () => {
      Object.keys(filterState).forEach(k => filterState[k] = new Set());
      filtersEl.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; });
      filtersEl.querySelectorAll('.ms-badge').forEach(b => { b.style.display = 'none'; });
      filtersEl.querySelectorAll('.ms-btn').forEach(b => b.classList.remove('active'));
      renderTable();
    });

    let filteredRows = rows;
    function renderTable() {
      filteredRows = rows.filter(r => {
        if (filterState.cve?.size       && !filterState.cve.has((r.CVE || '').trim())) return false;
        if (filterState.component?.size && !filterState.component.has(r.OCP_COMPONENT)) return false;
        if (filterState.package?.size   && !filterState.package.has(r.COMPONENT)) return false;
        if (filterState.pkgver?.size    && !filterState.pkgver.has(r.VERSION)) return false;
        if (filterState.severity?.size  && !filterState.severity.has(r.SEVERITY)) return false;
        if (filterState.state?.size     && !filterState.state.has(statusKey(r.AUDIT_RESULT))) return false;
        if (filterState.image?.size     && !filterState.image.has((r.IMAGE || '').replace(/@sha256:[0-9a-f]+$/, ''))) return false;
        if (filterState.fixable?.size) {
          const fi = (r.FIXED_IN || '').trim();
          const fixLabel = (fi && fi !== 'nan') ? 'Fix' : 'No fix';
          if (!filterState.fixable.has(fixLabel)) return false;
        }
        if (mismatchOnly && String(r.SEVERITY_MISMATCH).toLowerCase() !== 'true') return false;
        return true;
      });

      $('filter-count').textContent = `${filteredRows.length} of ${rows.length} shown`;
      $('filter-clear').style.display = Object.values(filterState).some(s => s?.size) ? '' : 'none';

      if (!filteredRows.length) {
        $('table-wrap').innerHTML = `<div class="empty"><h3>No matches</h3><p>Adjust filters above.</p></div>`;
        return;
      }

      const trs = filteredRows.map((r, i) => {
        const isMis = String(r.SEVERITY_MISMATCH).toLowerCase() === 'true';
        const fixedIn = (r.FIXED_IN || '').trim();
        const hasFixedIn = fixedIn && fixedIn !== 'nan';
        const fixLabel = hasFixedIn
          ? (fixedIn.match(/^\d/) ? `OCP ${fixedIn}` : fixedIn)
          : '';
        const fixBadge = hasFixedIn
          ? `<span class="badge bg-green">${esc(fixLabel)}</span>`
          : `<span class="badge bg-gray">No fix</span>`;
        return `
          <tr class="main-row" data-idx="${i}">
            <td class="expand-cell"><button class="expand-btn">▸</button></td>
            <td class="op"><strong>${esc(r.OCP_COMPONENT || '')}</strong></td>
            <td><code>${esc(r.COMPONENT || '')}</code></td>
            <td><code>${esc(r.VERSION || '')}</code></td>
            <td><code>${esc(r.CVE || '')}</code></td>
            <td>${severityCompare(r.SEVERITY, r.RHACS_SEVERITY, isMis)}</td>
            <td style="white-space:nowrap">${statusBadge(r.AUDIT_RESULT)}</td>
            <td style="white-space:nowrap">${fixBadge}</td>
          </tr>
          <tr class="detail-row" id="detail-${i}" hidden>
            <td></td><td colspan="7">${renderExpandRow(r)}</td>
          </tr>`;
      }).join('');

      $('table-wrap').innerHTML = `<table><thead><tr>
        <th style="width:32px"></th><th>OCP Component</th><th>Package</th>
        <th>Version</th><th>CVE</th><th>Severity (VEX → RHACS)</th><th>State</th><th>Fix</th>
      </tr></thead><tbody>${trs}</tbody></table>`;

      wireExpandButtons($('table-wrap'));
    }

    renderTable();

    $('export-btn').addEventListener('click', () => {
      const cols = [
        ['OCP Component', r => r.OCP_COMPONENT],
        ['Package', r => r.COMPONENT],
        ['Version', r => r.VERSION],
        ['CVE', r => r.CVE],
        ['VEX Severity', r => r.SEVERITY],
        ['RHACS Severity', r => r.RHACS_SEVERITY],
        ['State', r => statusKey(r.AUDIT_RESULT)],
        ['Source', r => r.SOURCE || ''],
        ['Location', r => r.LOCATION || ''],
        ['Image', r => r.IMAGE || ''],
        ['Justification', r => r.JUSTIFICATION],
      ];
      downloadCSV(filteredRows, cols, `ocp-${ver}-triage.csv`);
    });

  } catch (e) {
    console.error(e);
    $('content').innerHTML = `<div class="empty"><h3>Error loading ${esc(ver)}</h3><p>${esc(e.message)}</p></div>`;
  }
}

// ══════════════════════════════════════════════════════════════
// ── COMPARE VIEW ──
// ══════════════════════════════════════════════════════════════
async function renderCompare() {
  const ocpKeys = Object.keys(manifest.scopes || {}).filter(k => k.startsWith('ocp/')).sort().reverse();
  const options = ocpKeys.map(k => `<option value="${k}">${k.replace('ocp/', 'OCP ')}</option>`).join('');

  $('content').innerHTML = `
    <div class="section-header"><h2>Compare Versions</h2></div>
    <div class="compare-controls">
      <select id="cmp-a">${options}</select>
      <span style="color:var(--muted)">vs</span>
      <select id="cmp-b">${options}</select>
      <button class="btn btn-primary" id="cmp-go">Compare</button>
    </div>
    <div id="cmp-results"></div>`;

  if (ocpKeys.length >= 2) $('cmp-b').selectedIndex = 1;

  $('cmp-go').addEventListener('click', async () => {
    const a = $('cmp-a').value, b = $('cmp-b').value;
    if (a === b) { $('cmp-results').innerHTML = `<p style="color:var(--yellow)">Select two different versions.</p>`; return; }
    $('cmp-results').innerHTML = `<div class="empty"><div class="spinner"></div><p style="margin-top:1rem;color:var(--muted)">Comparing…</p></div>`;

    try {
      const nameA = await registerScope(manifest, a);
      const nameB = await registerScope(manifest, b);
      const verA = a.replace('ocp/', ''), verB = b.replace('ocp/', '');

      const SEV_ORDER = ['Critical','Important','Moderate','Low','Unknown'];
      const SEV_COLORS = { Critical:'var(--red)', Important:'var(--orange)', Moderate:'var(--yellow)', Low:'var(--muted)', Unknown:'#6e7681' };

      // Only positives — no false positives
      const [stats] = await query(`
        WITH from_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameA}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        ), to_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameB}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        )
        SELECT
          (SELECT COUNT(*) FROM from_cves) AS from_total,
          (SELECT COUNT(*) FROM to_cves) AS to_total,
          (SELECT COUNT(*) FROM from_cves WHERE CVE NOT IN (SELECT CVE FROM to_cves)) AS fixed,
          (SELECT COUNT(*) FROM to_cves WHERE CVE NOT IN (SELECT CVE FROM from_cves)) AS new_cves,
          (SELECT COUNT(*) FROM from_cves WHERE CVE IN (SELECT CVE FROM to_cves)) AS common
      `);

      const fixedBySev = await query(`
        WITH from_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameA}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        ), to_cves AS (
          SELECT DISTINCT CVE FROM '${nameB}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        )
        SELECT SEVERITY AS sev, COUNT(*) AS cnt FROM from_cves WHERE CVE NOT IN (SELECT CVE FROM to_cves) GROUP BY SEVERITY
      `);
      const newBySev = await query(`
        WITH from_cves AS (
          SELECT DISTINCT CVE FROM '${nameA}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        ), to_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameB}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        )
        SELECT SEVERITY AS sev, COUNT(*) AS cnt FROM to_cves WHERE CVE NOT IN (SELECT CVE FROM from_cves) GROUP BY SEVERITY
      `);

      // Fixed/new CVE detail lists
      const fixedList = await query(`
        WITH from_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameA}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        ), to_cves AS (
          SELECT DISTINCT CVE FROM '${nameB}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        )
        SELECT CVE, SEVERITY FROM from_cves WHERE CVE NOT IN (SELECT CVE FROM to_cves) ORDER BY
          CASE SEVERITY WHEN 'Critical' THEN 0 WHEN 'Important' THEN 1 WHEN 'Moderate' THEN 2 ELSE 3 END, CVE
      `);
      const newList = await query(`
        WITH from_cves AS (
          SELECT DISTINCT CVE FROM '${nameA}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        ), to_cves AS (
          SELECT DISTINCT CVE, SEVERITY FROM '${nameB}' WHERE AUDIT_RESULT LIKE '%POSITIVE%' AND AUDIT_RESULT NOT LIKE '%FALSE%'
        )
        SELECT CVE, SEVERITY FROM to_cves WHERE CVE NOT IN (SELECT CVE FROM from_cves) ORDER BY
          CASE SEVERITY WHEN 'Critical' THEN 0 WHEN 'Important' THEN 1 WHEN 'Moderate' THEN 2 ELSE 3 END, CVE
      `);

      const net = Number(stats.fixed) - Number(stats.new_cves);
      const sevRow = (data) => SEV_ORDER.map(s => {
        const c = (data.find(x => x.sev === s) || {}).cnt || 0;
        return c ? `<span style="color:${SEV_COLORS[s]}">${s}: ${c}</span>` : '';
      }).filter(Boolean).join('&nbsp;&nbsp;');

      $('cmp-results').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:1.5rem;align-items:center;margin:1.5rem 0">
          <div style="text-align:center">
            <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;margin-bottom:.2rem">From</div>
            <div style="font-size:1.3rem;font-weight:700">${esc(verA)}</div>
            <div style="font-size:1.8rem;font-weight:700;color:var(--red);margin:.2rem 0">${stats.from_total}</div>
            <div style="font-size:.72rem;color:var(--muted)">POSITIVE CVEs</div>
          </div>
          <div style="font-size:2rem;color:var(--accent)">→</div>
          <div style="text-align:center">
            <div style="font-size:.68rem;color:var(--muted);text-transform:uppercase;margin-bottom:.2rem">To</div>
            <div style="font-size:1.3rem;font-weight:700">${esc(verB)}</div>
            <div style="font-size:1.8rem;font-weight:700;color:${Number(stats.to_total) < Number(stats.from_total) ? 'var(--green)' : 'var(--red)'};margin:.2rem 0">${stats.to_total}</div>
            <div style="font-size:.72rem;color:var(--muted)">POSITIVE CVEs</div>
          </div>
        </div>

        <div class="cards">
          <div class="card"><div class="card-label">Fixed</div><div class="card-value green">-${stats.fixed}</div></div>
          <div class="card"><div class="card-label">New</div><div class="card-value red">+${stats.new_cves}</div></div>
          <div class="card"><div class="card-label">Net Change</div><div class="card-value ${net > 0 ? 'green' : 'red'}">${net > 0 ? '-' : '+'}${Math.abs(net)}</div></div>
          <div class="card"><div class="card-label">Common</div><div class="card-value">${stats.common}</div></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem">
          <div>
            <div style="font-size:.78rem;font-weight:600;color:var(--green);margin-bottom:.4rem">Fixed by upgrading (${stats.fixed})</div>
            <div style="font-size:.78rem">${sevRow(fixedBySev)}</div>
          </div>
          <div>
            <div style="font-size:.78rem;font-weight:600;color:var(--red);margin-bottom:.4rem">New in ${esc(verB)} (${stats.new_cves})</div>
            <div style="font-size:.78rem">${sevRow(newBySev)}</div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
          ${fixedList.length ? `<div>
            <h3 style="font-size:.85rem;color:var(--green);margin-bottom:.5rem">Fixed CVEs (${fixedList.length})</h3>
            <div class="table-wrap" style="max-height:40vh"><table><thead><tr><th>CVE</th><th>Severity</th></tr></thead><tbody>
            ${fixedList.map(r => `<tr><td><a href="#cve/${r.CVE}" style="color:var(--accent);text-decoration:none"><code>${esc(r.CVE)}</code></a></td><td>${severityBadge(r.SEVERITY)}</td></tr>`).join('')}
            </tbody></table></div>
          </div>` : '<div></div>'}
          ${newList.length ? `<div>
            <h3 style="font-size:.85rem;color:var(--red);margin-bottom:.5rem">New CVEs (${newList.length})</h3>
            <div class="table-wrap" style="max-height:40vh"><table><thead><tr><th>CVE</th><th>Severity</th></tr></thead><tbody>
            ${newList.map(r => `<tr><td><a href="#cve/${r.CVE}" style="color:var(--accent);text-decoration:none"><code>${esc(r.CVE)}</code></a></td><td>${severityBadge(r.SEVERITY)}</td></tr>`).join('')}
            </tbody></table></div>
          </div>` : '<div></div>'}
        </div>`;
    } catch (e) {
      console.error(e);
      $('cmp-results').innerHTML = `<div class="empty"><h3>Error</h3><p>${esc(e.message)}</p></div>`;
    }
  });
}

// ══════════════════════════════════════════════════════════════
// ── TRENDS VIEW ──
// ══════════════════════════════════════════════════════════════
async function renderTrends() {
  $('content').innerHTML = `
    <div class="section-header"><h2>Vulnerability Trends</h2><span class="sub">Unique POSITIVE CVEs by severity across OCP releases</span></div>
    <div class="chart-wrap" style="height:400px"><canvas id="trend-canvas"></canvas></div>
    <div id="trend-table"></div>`;

  if (!dbReady) return;

  const SEV_COLORS = { Critical: '#f85149', Important: '#e3b341', Moderate: '#d29922', Low: '#8b949e', Unknown: '#6e7681' };

  try {
    // Load all version parquets
    const allKeys = Object.keys(manifest.scopes || {}).filter(k => k.startsWith('ocp/'));
    const trendNames = await Promise.all(allKeys.map(k => registerScope(manifest, k)));
    const trendFiles = trendNames.map(n => `'${n}'`).join(', ');

    const data = await query(`
      SELECT OCP_VERSION as ver,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT NOT LIKE '%FALSE%' AND SEVERITY='Critical' THEN CVE END) as critical,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT NOT LIKE '%FALSE%' AND SEVERITY='Important' THEN CVE END) as important,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT NOT LIKE '%FALSE%' AND SEVERITY='Moderate' THEN CVE END) as moderate,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT NOT LIKE '%FALSE%' AND SEVERITY='Low' THEN CVE END) as low,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT NOT LIKE '%FALSE%' AND SEVERITY='Unknown' THEN CVE END) as unknown,
             COUNT(DISTINCT CASE WHEN AUDIT_RESULT LIKE '%FALSE%' THEN CVE END) as false_positive
      FROM read_parquet([${trendFiles}])
      GROUP BY OCP_VERSION
      ORDER BY
        CAST(split_part(OCP_VERSION, '.', 1) AS INT),
        CAST(split_part(OCP_VERSION, '.', 2) AS INT),
        CAST(split_part(OCP_VERSION, '.', 3) AS INT)
    `);

    const labels = data.map(r => r.ver);
    if (trendChart) trendChart.destroy();
    trendChart = new Chart($('trend-canvas'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Critical',  data: data.map(r => Number(r.critical)),  borderColor: SEV_COLORS.Critical,
            backgroundColor: SEV_COLORS.Critical + '40', fill: true, tension: .3, pointRadius: 3, borderWidth: 2, order: 5 },
          { label: 'Important', data: data.map(r => Number(r.important)), borderColor: SEV_COLORS.Important,
            backgroundColor: SEV_COLORS.Important + '40', fill: true, tension: .3, pointRadius: 3, borderWidth: 2, order: 4 },
          { label: 'Moderate',  data: data.map(r => Number(r.moderate)),  borderColor: SEV_COLORS.Moderate,
            backgroundColor: SEV_COLORS.Moderate + '40', fill: true, tension: .3, pointRadius: 3, borderWidth: 2, order: 3 },
          { label: 'Low',       data: data.map(r => Number(r.low)),       borderColor: SEV_COLORS.Low,
            backgroundColor: SEV_COLORS.Low + '40', fill: true, tension: .3, pointRadius: 3, borderWidth: 2, order: 2 },
          { label: 'Unknown',   data: data.map(r => Number(r.unknown)),   borderColor: SEV_COLORS.Unknown,
            backgroundColor: SEV_COLORS.Unknown + '40', fill: true, tension: .3, pointRadius: 3, borderWidth: 2, order: 1 },
          { label: 'Total',     data: data.map(r => Number(r.critical) + Number(r.important) + Number(r.moderate) + Number(r.low) + Number(r.unknown)),
            borderColor: '#e6edf3', backgroundColor: 'transparent', fill: false,
            tension: .3, pointRadius: 4, borderWidth: 2.5, borderDash: [6, 3], order: 0 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: '#e6edf3', padding: 12 } },
          tooltip: {
            callbacks: {
              footer: items => {
                const total = items.find(i => i.dataset.label === 'Total');
                return total ? '' : 'Total: ' + items.reduce((s, i) => s + i.parsed.y, 0);
              }
            }
          }
        },
        scales: {
          x: { ticks: { color: '#8b949e', maxRotation: 45 }, grid: { color: 'rgba(48,54,61,.3)' } },
          y: { stacked: true, ticks: { color: '#8b949e' }, grid: { color: 'rgba(48,54,61,.5)' },
            title: { display: true, text: 'Unique CVEs', color: '#8b949e' } }
        },
        onClick: (evt) => {
          const points = trendChart.getElementsAtEventForMode(evt, 'index', { intersect: false }, false);
          if (!points.length) return;
          const clickedVer = data[points[0].index].ver;
          navigate('ocp/' + clickedVer);
        }
      }
    });

    // Compute totals and deltas
    const enriched = data.map((r, i) => {
      const total = Number(r.critical) + Number(r.important) + Number(r.moderate) + Number(r.low) + Number(r.unknown);
      const prev = i > 0 ? data[i-1] : null;
      const prevTotal = prev ? Number(prev.critical) + Number(prev.important) + Number(prev.moderate) + Number(prev.low) + Number(prev.unknown) : null;
      const delta = prevTotal !== null ? total - prevTotal : null;
      return { ...r, total, delta };
    });

    const deltaFmt = (d) => {
      if (d === null) return '<span style="color:var(--muted)">—</span>';
      if (d === 0) return '<span style="color:var(--muted)">0</span>';
      if (d > 0) return `<span style="color:var(--red)">+${d}</span>`;
      return `<span style="color:var(--green)">${d}</span>`;
    };

    $('trend-table').innerHTML = `
      <div class="table-wrap" style="margin-top:1rem"><table><thead><tr>
        <th>Version</th><th>Total</th><th>Δ</th><th>Critical</th><th>Important</th><th>Moderate</th><th>Low</th><th>Unknown</th><th>False Positive</th>
      </tr></thead><tbody>
      ${enriched.map(r => `<tr>
        <td><a href="#ocp/${r.ver}" style="color:var(--accent);text-decoration:none">${esc(r.ver)}</a></td>
        <td><strong>${r.total}</strong></td>
        <td>${deltaFmt(r.delta)}</td>
        <td style="color:var(--red)">${r.critical}</td>
        <td style="color:var(--orange)">${r.important}</td>
        <td style="color:var(--yellow)">${r.moderate}</td>
        <td>${r.low}</td>
        <td style="color:var(--muted)">${r.unknown}</td>
        <td style="color:var(--green)">${r.false_positive}</td>
      </tr>`).join('')}
      </tbody></table></div>`;

  } catch (e) {
    console.error(e);
    $('content').innerHTML += `<div class="empty"><h3>Error loading trends</h3><p>${esc(e.message)}</p></div>`;
  }
}

// ══════════════════════════════════════════════════════════════
// ── CVE SEARCH VIEW ──
// ══════════════════════════════════════════════════════════════
async function renderCVESearch(initialCve) {
  $('content').innerHTML = `
    <div class="section-header"><h2>CVE Search</h2></div>
    <div class="search-box">
      <input class="search-input" id="cve-input" type="text" placeholder="CVE-2026-33186 or package name…"
             value="${esc(initialCve || '')}">
      <button class="btn btn-primary" id="cve-search-btn">Search</button>
    </div>
    <div id="cve-results"></div>`;

  const doSearch = async () => {
    const q = $('cve-input').value.trim().toUpperCase();
    if (!q) return;
    // Update hash without re-triggering renderCVESearch
    history.replaceState(null, '', '#cve/' + q);
    $('cve-results').innerHTML = `<div class="empty"><div class="spinner"></div><p style="margin-top:1rem;color:var(--muted)">Searching…</p></div>`;

    try {
      // Load all parquets (OCP + operators)
      const allKeys = Object.keys(manifest.scopes || {});
      const names = await Promise.all(allKeys.map(k => registerScope(manifest, k)));

      const safe = q.replace(/'/g, "''");
      const filesList = names.map(n => `'${n}'`).join(', ');
      const rows = await query(`
        SELECT * FROM read_parquet([${filesList}], union_by_name=true)
        WHERE upper(CVE) LIKE '%${safe}%'
           OR upper(COMPONENT) LIKE '%${safe}%'
           OR upper(coalesce(OCP_COMPONENT, '')) LIKE '%${safe}%'
        ORDER BY OCP_VERSION, coalesce(OCP_COMPONENT, COMPONENT), COMPONENT
      `);

      if (!rows.length) {
        $('cve-results').innerHTML = `<div class="empty"><h3>No results for ${esc(q)}</h3></div>`;
        return;
      }

      const versions    = [...new Set(rows.map(r => r.OCP_VERSION))].sort();
      const components  = [...new Set(rows.map(r => r.OCP_COMPONENT || '').filter(Boolean))].sort();
      const packages    = [...new Set(rows.map(r => r.COMPONENT || '').filter(Boolean))].sort();
      const severities  = [...new Set(rows.map(r => r.SEVERITY || '').filter(Boolean))].sort();
      const states      = [...new Set(rows.map(r => statusKey(r.AUDIT_RESULT)).filter(Boolean))].sort();
      const posCount    = rows.filter(r => !String(r.AUDIT_RESULT).includes('FALSE') && String(r.AUDIT_RESULT).includes('POSITIVE')).length;
      const fpCount     = rows.filter(r => String(r.AUDIT_RESULT).includes('FALSE')).length;
      const uniqueImgs  = new Set(rows.map(r => r.OCP_COMPONENT)).size;

      const cveFilterState = {};
      let cveFilteredRows = rows;

      $('cve-results').innerHTML = `
        <div class="cards">
          <div class="card"><div class="card-label">Total Findings</div><div class="card-value blue">${rows.length}</div></div>
          <div class="card"><div class="card-label">Versions</div><div class="card-value">${versions.length}</div></div>
          <div class="card"><div class="card-label">Components</div><div class="card-value">${uniqueImgs}</div></div>
          <div class="card"><div class="card-label">Positive</div><div class="card-value red">${posCount}</div></div>
          <div class="card"><div class="card-label">False Positive</div><div class="card-value green">${fpCount}</div></div>
        </div>
        <div class="filter-bar" style="display:flex;align-items:center;flex-wrap:wrap;gap:.35rem">
          <label>FILTER BY:</label>
          <div id="cve-filters" style="display:flex;align-items:center;flex-wrap:wrap;gap:.35rem"></div>
          <span class="filter-count" id="cve-filter-count">${rows.length} shown</span>
          <button class="filter-clear" id="cve-filter-clear" style="display:none">Clear all</button>
        </div>
        <div style="margin-bottom:.5rem;text-align:right">
          <button class="btn-export" id="cve-export-btn">Export CSV</button>
        </div>
        <div class="table-wrap" id="cve-table-wrap"></div>`;

      const cveFiltersEl = $('cve-filters');
      const onCveFilter = (id, selected) => { cveFilterState[id] = selected; renderCveTable(); };
      cveFiltersEl.appendChild(createDropdown('version', 'OCP Version', versions, onCveFilter));
      cveFiltersEl.appendChild(createDropdown('component', 'Component', components, onCveFilter));
      cveFiltersEl.appendChild(createDropdown('package', 'Package', packages, onCveFilter));
      cveFiltersEl.appendChild(createDropdown('severity', 'Severity', severities, onCveFilter));
      cveFiltersEl.appendChild(createDropdown('state', 'State', states, onCveFilter));
      cveFiltersEl.appendChild(createDropdown('fixable', 'Fix', ['Fix', 'No fix'], onCveFilter));

      $('cve-filter-clear').addEventListener('click', () => {
        Object.keys(cveFilterState).forEach(k => cveFilterState[k] = new Set());
        cveFiltersEl.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; });
        cveFiltersEl.querySelectorAll('.ms-badge').forEach(b => { b.style.display = 'none'; });
        cveFiltersEl.querySelectorAll('.ms-btn').forEach(b => b.classList.remove('active'));
        renderCveTable();
      });

      function renderCveTable() {
        cveFilteredRows = rows.filter(r => {
          if (cveFilterState.version?.size   && !cveFilterState.version.has(r.OCP_VERSION)) return false;
          if (cveFilterState.component?.size && !cveFilterState.component.has(r.OCP_COMPONENT)) return false;
          if (cveFilterState.package?.size   && !cveFilterState.package.has(r.COMPONENT)) return false;
          if (cveFilterState.severity?.size  && !cveFilterState.severity.has(r.SEVERITY)) return false;
          if (cveFilterState.state?.size     && !cveFilterState.state.has(statusKey(r.AUDIT_RESULT))) return false;
          if (cveFilterState.fixable?.size) {
            const fi = (r.FIXED_IN || '').trim();
            const fixLabel = (fi && fi !== 'nan') ? 'Fix' : 'No fix';
            if (!cveFilterState.fixable.has(fixLabel)) return false;
          }
          return true;
        });

        $('cve-filter-count').textContent = `${cveFilteredRows.length} of ${rows.length} shown`;
        $('cve-filter-clear').style.display = Object.values(cveFilterState).some(s => s?.size) ? '' : 'none';

        if (!cveFilteredRows.length) {
          $('cve-table-wrap').innerHTML = `<div class="empty"><h3>No matches</h3><p>Adjust filters above.</p></div>`;
          return;
        }

        const trs = cveFilteredRows.map((r, i) => {
          const isMis = String(r.SEVERITY_MISMATCH).toLowerCase() === 'true';
          return `
          <tr class="main-row" data-idx="cve${i}">
            <td class="expand-cell"><button class="expand-btn">▸</button></td>
            <td>${r.SCOPE && r.SCOPE.startsWith('operators/')
              ? `<a href="#${r.SCOPE}" style="color:var(--accent);text-decoration:none">${esc(r.OCP_VERSION)}</a>`
              : `<a href="#ocp/${r.OCP_VERSION}" style="color:var(--accent);text-decoration:none">${esc(r.OCP_VERSION)}</a>`
            }</td>
            <td class="op">${r.SCOPE && r.SCOPE.startsWith('operators/')
              ? `<a href="#${r.SCOPE}" style="color:var(--accent);text-decoration:none;font-weight:600">${esc(r.OCP_COMPONENT || '')}</a><br><span style="font-size:.65rem;color:var(--muted)">${esc(r.SCOPE.replace('operators/','').replace(/\//,' / '))}</span>`
              : `<strong>${esc(r.OCP_COMPONENT || '')}</strong><br><span style="font-size:.65rem;color:var(--muted)">OCP ${esc(r.OCP_VERSION || '')}</span>`
            }</td>
            <td><code>${esc(r.COMPONENT || '')}</code></td>
            <td><code>${esc(r.VERSION || '')}</code></td>
            <td>${severityCompare(r.SEVERITY, r.RHACS_SEVERITY, isMis)}</td>
            <td style="white-space:nowrap">${statusBadge(r.AUDIT_RESULT)}</td>
            <td style="white-space:nowrap">${(() => {
              const fi = (r.FIXED_IN || '').trim();
              const fiLabel = fi.match(/^\d/) ? `OCP ${fi}` : fi;
              return (fi && fi !== 'nan')
                ? `<span class="badge bg-green">${esc(fiLabel)}</span>`
                : `<span class="badge bg-gray">No fix</span>`;
            })()}</td>
          </tr>
          <tr class="detail-row" id="detail-cve${i}" hidden>
            <td></td><td colspan="7">${renderExpandRow(r)}</td>
          </tr>`;
        }).join('');

        $('cve-table-wrap').innerHTML = `<table><thead><tr>
          <th style="width:32px"></th><th>Version</th><th>OCP Component</th><th>Package</th>
          <th>Pkg Version</th><th>Severity (VEX → RHACS)</th><th>State</th><th>Fix</th>
        </tr></thead><tbody>${trs}</tbody></table>`;

        wireExpandButtons($('cve-table-wrap'));
      }

      renderCveTable();

      $('cve-export-btn').addEventListener('click', () => {
        const cols = [
          ['OCP Version', r => r.OCP_VERSION],
          ['OCP Component', r => r.OCP_COMPONENT],
          ['Package', r => r.COMPONENT],
          ['Version', r => r.VERSION],
          ['CVE', r => r.CVE],
          ['VEX Severity', r => r.SEVERITY],
          ['RHACS Severity', r => r.RHACS_SEVERITY],
          ['State', r => statusKey(r.AUDIT_RESULT)],
          ['Source', r => r.SOURCE || ''],
          ['Location', r => r.LOCATION || ''],
          ['Image', r => r.IMAGE || ''],
          ['Justification', r => r.JUSTIFICATION || ''],
        ];
        const ts = new Date().toISOString().slice(0,19).replace('T','_').replace(/:/g,'-');
        downloadCSV(cveFilteredRows, cols, `cve-search-${q}-${ts}.csv`);
      });

    } catch (e) {
      console.error(e);
      $('cve-results').innerHTML = `<div class="empty"><h3>Error</h3><p>${esc(e.message)}</p></div>`;
    }
  };

  $('cve-search-btn').addEventListener('click', doSearch);
  $('cve-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  if (initialCve) doSearch();
}

// ── Boot ──
init();
</script>
</body>
</html>
