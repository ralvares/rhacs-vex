[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vextriage"
description = "Triage grype / trivy / syft findings against Red Hat CSAF-VEX and publish the verdicts as OpenVEX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Rodrigo Alvares" }]
keywords = ["vex", "csaf", "openvex", "grype", "trivy", "syft", "red hat", "rhel", "openshift", "triage", "cve"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
    "requests",
    "rich",
    "packaging",
]

[project.optional-dependencies]
archive = ["zstandard"]
test = ["pytest"]

[project.scripts]
vextriage = "vextriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "vextriage.__version__" }
